<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>حلوة عباتچ · نظام إدارة المبيعات</title>
<meta name="description" content="نظام حلوة عباتچ لإدارة الموديلات، المشتريات، المبيعات، والديون.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حلوة عباتچ">
<meta name="theme-color" content="#0f1424">

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
:root {
    --bg-primary: #0f1424;
    --bg-card: #1a2035;
    --accent: #d4af37;
    --accent-hover: #f1c40f;
    --text-main: #ffffff;
    --text-sub: #8a99ad;
    --danger: #e74c3c;
    --success: #2ecc71;
    --border: #2a344d;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}

body {
    background-color: var(--bg-primary);
    color: var(--text-main);
    padding-bottom: 70px;
    direction: rtl;
}

/* Header & Status Bar */
header {
    background-color: var(--bg-card);
    padding: 15px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
}

.cloud-status {
    font-size: 0.8rem;
    margin-top: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--danger);
}

.status-dot.online {
    background-color: var(--success);
}

/* Navigation Bar */
nav {
    position: fixed;
    bottom: 0;
    width: 100%;
    background-color: var(--bg-card);
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    border-top: 1px solid var(--border);
    z-index: 100;
}

nav button {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
}

nav button.active {
    color: var(--accent);
}

/* Main Container & Sections */
.container {
    padding: 15px;
    max-width: 600px;
    margin: 0 auto;
}

.section {
    display: none;
}

.section.active {
    display: block;
}

/* Form Controls */
.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 5px;
    color: var(--text-sub);
    font-size: 0.9rem;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    background-color: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-main);
    font-size: 1rem;
    outline: none;
}

input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
}

button.btn-action {
    width: 100%;
    padding: 12px;
    background-color: var(--accent);
    color: var(--bg-primary);
    border: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    transition: background-color 0.2s;
}

button.btn-action:hover {
    background-color: var(--accent-hover);
}

/* Cards & Lists */
.card {
    background-color: var(--bg-card);
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
    border: 1px solid var(--border);
}

.card-title {
    font-size: 1.1rem;
    color: var(--accent);
    margin-bottom: 8px;
}

.card-info {
    font-size: 0.9rem;
    color: var(--text-sub);
    margin-bottom: 4px;
}

.card-img {
    width: 100%;
    max-height: 200px;
    object-fit: cover;
    border-radius: 6px;
    margin-top: 10px;
}

.sync-bar {
    background-color: #161b2e;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px dashed var(--accent);
    text-align: center;
    font-size: 0.85rem;
}
</style>
</head>
<body>

<header>
    <h2>حلوة عباتچ</h2>
    <div class="cloud-status">
        <div id="statusDot" class="status-dot"></div>
        <span id="statusText">جاري الاتصال بالسحابة...</span>
    </div>
</header>

<div class="container">

    <!-- Configuration Banner -->
    <div id="configNotice" class="sync-bar" style="display: none;">
        تنبيه: اضبط إعدادات Firebase الخاصة بك في أسفل الكود لتفعيل المزامنة السحابية الحقيقية!
    </div>

    <!-- Section: Add Product / Inventory -->
    <div id="sec-models" class="section active">
        <div class="card">
            <h3 class="card-title">إضافة موديل جديد</h3>
            <form id="addModelForm">
                <div class="form-group">
                    <label>اسم الموديل / الرمز</label>
                    <input type="text" id="modelName" required placeholder="مثال: عباية بشت أسود">
                </div>
                <div class="form-group">
                    <label>سعر الشراء / التكلفة (د.ع)</label>
                    <input type="number" id="modelCost" required placeholder="0">
                </div>
                <div class="form-group">
                    <label>سعر البيع المقترح (د.ع)</label>
                    <input type="number" id="modelPrice" required placeholder="0">
                </div>
                <div class="form-group">
                    <label>الكمية المتوفرة</label>
                    <input type="number" id="modelQty" required placeholder="1">
                </div>
                <div class="form-group">
                    <label>صورة الموديل (سيتم ضغطها تلقائياً)</label>
                    <input type="file" id="modelImage" accept="image/*">
                </div>
                <button type="submit" class="btn-action">حفظ الموديل</button>
            </form>
        </div>

        <h3>المخزن الحالي</h3>
        <div id="modelsList"></div>
    </div>

    <!-- Section: Sales -->
    <div id="sec-sales" class="section">
        <div class="card">
            <h3 class="card-title">تسجيل عملية بيع</h3>
            <form id="addSaleForm">
                <div class="form-group">
                    <label>اختر الموديل</label>
                    <select id="saleModelSelect" required>
                        <option value="">اختر موديل...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>سعر البيع الفعلي (د.ع)</label>
                    <input type="number" id="salePrice" required placeholder="0">
                </div>
                <div class="form-group">
                    <label>الكمية المباعة</label>
                    <input type="number" id="saleQty" value="1" required>
                </div>
                <div class="form-group">
                    <label>اسم الزبون (اختياري)</label>
                    <input type="text" id="customerName" placeholder="اسم الزبون">
                </div>
                <div class="form-group">
                    <label>المبلغ المدفوع (اتركه أقل من السعر إذا كان دين)</label>
                    <input type="number" id="paidAmount" placeholder="المبلغ">
                </div>
                <button type="submit" class="btn-action">إتمام البيع</button>
            </form>
        </div>

        <h3>سجل المبيعات الأخيرة</h3>
        <div id="salesList"></div>
    </div>

    <!-- Section: Debts -->
    <div id="sec-debts" class="section">
        <h3>سجل الديون والالتزامات</h3>
        <div id="debtsList"></div>
    </div>

</div>

<!-- Navigation Footer -->
<nav>
    <button onclick="switchTab('sec-models')" class="active" id="btn-sec-models">
        <span>👗</span> الموديلات
    </button>
    <button onclick="switchTab('sec-sales')" id="btn-sec-sales">
        <span>💰</span> المبيعات
    </button>
    <button onclick="switchTab('sec-debts')" id="btn-sec-debts">
        <span>📋</span> الديون
    </button>
</nav>

<script>
// ==========================================
// 1. إعدادات السحابة (Firebase Configuration)
// ==========================================
// استبدل الأسطر التالية بإعدادات مشروعك من Firebase Console ليعمل الربط مع جهاز آخر
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "123456789",
    appId: "YOUR_APP_ID"
};

// تهيئة Firebase
let db = null;
let isOnline = false;

try {
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        // تفعيل التخزين المحلي ليعمل بدون إنترنت أيضاً
        db.enablePersistence().catch(err => console.log("Persistence error:", err));
        isOnline = true;
        updateStatus(true, "متصل بالسحابة (مزامنة فورية)");
    } else {
        document.getElementById('configNotice').style.display = 'block';
        updateStatus(false, "يعمل محلياً فقط (لم يكتمل إعداد Firebase)");
    }
} catch (e) {
    console.error("Firebase init failed:", e);
    updateStatus(false, "خطأ في الاتصال بالسحابة");
}

function updateStatus(online, message) {
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    text.innerText = message;
    if (online) {
        dot.classList.add('online');
    } else {
        dot.classList.remove('online');
    }
}

// ==========================================
// 2. إدارة البيانات المحلية (Local Fallback)
// ==========================================
let localData = {
    models: JSON.parse(localStorage.getItem('hw_models') || '[]'),
    sales: JSON.parse(localStorage.getItem('hw_sales') || '[]')
};

function saveLocal() {
    localStorage.setItem('hw_models', JSON.stringify(localData.models));
    localStorage.setItem('hw_sales', JSON.stringify(localData.sales));
    renderAll();
}

// ==========================================
// 3. ضغط الصور لتفادي استهلاك المساحة
// ==========================================
function compressImage(file, callback) {
    const reader = new FileReader();
    reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 400;
            const scaleSize = MAX_WIDTH / img.width;
            canvas.width = MAX_WIDTH;
            canvas.height = img.height * scaleSize;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            // ضغط إلى JPEG بجودة 60%
            callback(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

// ==========================================
// 4. وظائف النوافذ والتنقل
// ==========================================
function switchTab(tabId) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    document.getElementById('btn-' + tabId).classList.add('active');
}

// ==========================================
// 5. العمليات الأحداث (Events & Logic)
// ==========================================

// إضافة موديل
document.getElementById('addModelForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const name = document.getElementById('modelName').value;
    const cost = parseFloat(document.getElementById('modelCost').value) || 0;
    const price = parseFloat(document.getElementById('modelPrice').value) || 0;
    const qty = parseInt(document.getElementById('modelQty').value) || 0;
    const imgInput = document.getElementById('modelImage');

    const createModel = (imgBase64) => {
        const newModel = {
            id: Date.now().toString(),
            name,
            cost,
            price,
            qty,
            image: imgBase64 || '',
            createdAt: new Date().toISOString()
        };

        if (isOnline && db) {
            db.collection('models').doc(newModel.id).set(newModel);
        } else {
            localData.models.push(newModel);
            saveLocal();
        }

        this.reset();
        alert('تم حفظ الموديل بنجاح');
    };

    if (imgInput.files && imgInput.files[0]) {
        compressImage(imgInput.files[0], createModel);
    } else {
        createModel('');
    }
});

// تسجيل بيع
document.getElementById('addSaleForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const modelId = document.getElementById('saleModelSelect').value;
    const salePrice = parseFloat(document.getElementById('salePrice').value) || 0;
    const qty = parseInt(document.getElementById('saleQty').value) || 1;
    const customer = document.getElementById('customerName').value || 'زبون عام';
    const paid = parseFloat(document.getElementById('paidAmount').value);
    
    const actualPaid = isNaN(paid) ? (salePrice * qty) : paid;
    const totalDebt = (salePrice * qty) - actualPaid;

    if (!modelId) return alert('يرجى اختيار الموديل');

    const saleData = {
        id: Date.now().toString(),
        modelId,
        salePrice,
        qty,
        customer,
        paid: actualPaid,
        debt: totalDebt > 0 ? totalDebt : 0,
        date: new Date().toISOString()
    };

    if (isOnline && db) {
        // تحديث المخزن المتبقي والبيع في السحابة
        db.collection('sales').doc(saleData.id).set(saleData);
        db.collection('models').doc(modelId).get().then(doc => {
            if(doc.exists) {
                const currentQty = doc.data().qty || 0;
                db.collection('models').doc(modelId).update({
                    qty: Math.max(0, currentQty - qty)
                });
            }
        });
    } else {
        localData.sales.push(saleData);
        const model = localData.models.find(m => m.id === modelId);
        if (model) {
            model.qty = Math.max(0, model.qty - qty);
        }
        saveLocal();
    }

    this.reset();
    alert('تم تسجيل عملية البيع');
});

// ==========================================
// 6. عرض البيانات وتحديث الواجهة (Render)
// ==========================================
function renderAll() {
    renderModels();
    renderSales();
    renderDebts();
}

function renderModels() {
    const container = document.getElementById('modelsList');
    const select = document.getElementById('saleModelSelect');
    
    const list = isOnline ? liveModels : localData.models;

    container.innerHTML = '';
    select.innerHTML = '<option value="">اختر موديل...</option>';

    list.forEach(m => {
        // ملء قائمة الاختيار للبيع
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.innerText = `${m.name} (المتوفر: ${m.qty})`;
        select.appendChild(opt);

        // ملء بطاقات العرض
        container.innerHTML += `
            <div class="card">
                <div class="card-title">${m.name}</div>
                <div class="card-info">التكلفة: ${m.cost.toLocaleString()} د.ع | البيع: ${m.price.toLocaleString()} د.ع</div>
                <div class="card-info">الكمية المتوفرة: <strong>${m.qty}</strong></div>
                ${m.image ? `<img src="${m.image}" class="card-img" />` : ''}
            </div>
        `;
    });
}

function renderSales() {
    const container = document.getElementById('salesList');
    const list = isOnline ? liveSales : localData.sales;
    const models = isOnline ? liveModels : localData.models;

    container.innerHTML = '';

    list.slice().reverse().forEach(s => {
        const model = models.find(m => m.id === s.modelId);
        const modelName = model ? model.name : 'موديل غير معروف';

        container.innerHTML += `
            <div class="card">
                <div class="card-title">${modelName} (عدد ${s.qty})</div>
                <div class="card-info">الزبون: ${s.customer}</div>
                <div class="card-info">المبلغ الكلي: ${(s.salePrice * s.qty).toLocaleString()} د.ع</div>
                <div class="card-info">الواصل: ${s.paid.toLocaleString()} د.ع</div>
                ${s.debt > 0 ? `<div class="card-info" style="color:var(--danger)">المتبقي (دين): ${s.debt.toLocaleString()} د.ع</div>` : ''}
            </div>
        `;
    });
}

function renderDebts() {
    const container = document.getElementById('sec-debts');
    const list = isOnline ? liveSales : localData.sales;
    const debts = list.filter(s => s.debt > 0);

    container.innerHTML = '<h3>سجل الديون والالتزامات</h3>';

    if (debts.length === 0) {
        container.innerHTML += '<p style="color:var(--text-sub); margin-top:10px;">لا توجد ديون مسجلة حالياً.</p>';
        return;
    }

    debts.forEach(d => {
        container.innerHTML += `
            <div class="card">
                <div class="card-title" style="color:var(--danger)">مطلوب: ${d.customer}</div>
                <div class="card-info">مبلغ الدين: <strong>${d.debt.toLocaleString()} د.ع</strong></div>
                <div class="card-info">التاريخ: ${new Date(d.date).toLocaleDateString('ar-IQ')}</div>
            </div>
        `;
    });
}

// ==========================================
// 7. الاستماع المباشر للتغييرات في السحابة
// ==========================================
let liveModels = [];
let liveSales = [];

if (isOnline && db) {
    db.collection('models').onSnapshot(snapshot => {
        liveModels = snapshot.docs.map(doc => doc.data());
        renderAll();
    });

    db.collection('sales').onSnapshot(snapshot => {
        liveSales = snapshot.docs.map(doc => doc.data());
        renderAll();
    });
} else {
    renderAll();
}
</script>

</body>
</html>
