<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حلوة عباتچ - نظام إدارة المبيعات والمخزون</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0f1424">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="حلوة عباتچ">
    <meta name="description" content="تطبيق إدارة المبيعات والمخزون والديون لمحل حلوة عباتچ">

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0f1424;
            --bg-secondary: #1a2035;
            --card-bg: #242b45;
            --accent-gold: #d4af37;
            --accent-hover: #b89628;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 75px;
        }

        header {
            background-color: var(--bg-secondary);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent-gold);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .brand-title {
            color: var(--accent-gold);
            font-size: 1.4rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            padding: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .page-section {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .page-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 15px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background-color: var(--bg-secondary);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-gold);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background-color: var(--accent-gold);
            color: var(--bg-primary);
        }

        .btn:active {
            background-color: var(--accent-hover);
        }

        .item-list {
            list-style: none;
        }

        .list-item {
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 4px solid var(--accent-gold);
        }

        .delete-btn {
            background: transparent;
            color: var(--danger);
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 5px 10px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--bg-secondary);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            gap: 4px;
            cursor: pointer;
            width: 25%;
        }

        .nav-item i {
            font-size: 1.2rem;
        }

        .nav-item.active {
            color: var(--accent-gold);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: var(--bg-secondary);
            padding: 15px;
            border-radius: var(--radius);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-card .val {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">
            <i class="fa-solid fa-gem"></i>
            <span>حلوة عباتچ</span>
        </div>
        <div id="sync-status" style="font-size: 0.85rem; color: var(--warning);">
            <i class="fa-solid fa-spinner fa-spin"></i> يتصل بـ Firestore...
        </div>
    </header>

    <div class="container">

        <!-- 1. صفحة المبيعات وتسجيل الفواتير -->
        <section id="sales" class="page-section active">
            <div class="card">
                <h3><i class="fa-solid fa-file-invoice"></i> تسجيل فاتورة / بيع جديد</h3>
                <br>
                <div class="form-group">
                    <label>اسم الزبون (customerName)</label>
                    <input type="text" id="customerName" class="form-control" placeholder="مثال: ميسم">
                </div>
                <div class="form-group">
                    <label>تفاصيل الموديل/البضاعة (itemDetails)</label>
                    <input type="text" id="itemDetails" class="form-control" placeholder="مثال: دبل ستراس">
                </div>
                <div class="form-group">
                    <label>المبلغ الإجمالي (totalAmount)</label>
                    <input type="number" id="totalAmount" class="form-control" placeholder="مثال: 30000">
                </div>
                <button class="btn" onclick="addInvoice()">
                    <i class="fa-solid fa-check"></i> حفظ الفاتورة في Firestore
                </button>
            </div>
        </section>

        <!-- 2. صفحة عرض جميع الفواتير -->
        <section id="inventory" class="page-section">
            <div class="card">
                <h3><i class="fa-solid fa-list-check"></i> جميع الفواتير المسجلة</h3>
                <br>
                <ul id="invoices-list" class="item-list"></ul>
            </div>
        </section>

        <!-- 3. صفحة الديون والذمم -->
        <section id="debts" class="page-section">
            <div class="card">
                <h3><i class="fa-solid fa-hand-holding-dollar"></i> سجل الديون والذمم المالية</h3>
                <br>
                <ul id="debts-list" class="item-list"></ul>
            </div>
        </section>

        <!-- 4. التقارير والملخص -->
        <section id="reports" class="page-section">
            <div class="stat-grid">
                <div class="stat-card">
                    <div>إجمالي الفواتير</div>
                    <div class="val" id="total-count-val">0</div>
                </div>
                <div class="stat-card">
                    <div>المبلغ الإجمالي</div>
                    <div class="val" id="total-sum-val">0 د.ع</div>
                </div>
            </div>

            <div class="card">
                <h3>آخر العمليات المسجلة</h3>
                <br>
                <ul id="recent-list" class="item-list"></ul>
            </div>
        </section>

    </div>

    <!-- الشريط السفلي للتنقل -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('sales', this)">
            <i class="fa-solid fa-cash-register"></i>
            <span>إضافة فاتورة</span>
        </div>
        <div class="nav-item" onclick="switchTab('inventory', this)">
            <i class="fa-solid fa-receipt"></i>
            <span>الفواتير</span>
        </div>
        <div class="nav-item" onclick="switchTab('debts', this)">
            <i class="fa-solid fa-file-invoice-dollar"></i>
            <span>الديون</span>
        </div>
        <div class="nav-item" onclick="switchTab('reports', this)">
            <i class="fa-solid fa-chart-line"></i>
            <span>التقارير</span>
        </div>
    </nav>

    <!-- Firebase Firestore Integration Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            deleteDoc, 
            doc, 
            onSnapshot, 
            query, 
            orderBy, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        // إعدادات مشروع Firebase الخاص بك (hlwa-abatich)
        const firebaseConfig = {
            apiKey: "AIzaSyDF1WwFdugcjrNWYfs3QXo2ktatdeWuvf4",
            authDomain: "hlwa-abatich.firebaseapp.com",
            projectId: "hlwa-abatich",
            storageBucket: "hlwa-abatich.firebasestorage.app",
            messagingSenderId: "100175694788",
            appId: "1:100175694788:web:3820cf0a38d72c6bcab291",
            measurementId: "G-SCT7EX0CK4"
        };

        // تهيئة Firebase و Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // الاستماع المباشر للتغييرات في مجموعة invoices
        const invoicesRef = collection(db, "invoices");
        const q = query(invoicesRef, orderBy("createdAt", "desc"));

        onSnapshot(q, (snapshot) => {
            const invoicesList = document.getElementById('invoices-list');
            const debtsList = document.getElementById('debts-list');
            const recentList = document.getElementById('recent-list');
            const syncStatus = document.getElementById('sync-status');

            syncStatus.style.color = 'var(--success)';
            syncStatus.innerHTML = '<i class="fa-solid fa-cloud-check"></i> متصل بـ Firestore';

            invoicesList.innerHTML = '';
            debtsList.innerHTML = '';
            recentList.innerHTML = '';

            let totalSum = 0;
            let totalCount = 0;

            if (snapshot.empty) {
                invoicesList.innerHTML = '<p style="text-align:center; color:var(--text-muted);">لا توجد فواتير حالياً في Firestore</p>';
                debtsList.innerHTML = '<p style="text-align:center; color:var(--text-muted);">لا توجد ديون مسجلة</p>';
                recentList.innerHTML = '<p style="text-align:center; color:var(--text-muted);">لا توجد عمليات</p>';
                document.getElementById('total-sum-val').innerText = '0 د.ع';
                document.getElementById('total-count-val').innerText = '0';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                const amount = data.totalAmount || 0;
                const customer = data.customerName || 'بدون اسم';
                const details = data.itemDetails || 'بدون تفاصيل';
                const dateStr = data.createdAt?.toDate ? data.createdAt.toDate().toLocaleString('ar-IQ') : 'الآن';

                totalSum += amount;
                totalCount++;

                const itemHTML = `
                    <li class="list-item">
                        <div>
                            <strong>${customer}</strong>
                            <div style="font-size:0.85rem; color:var(--text-muted); margin-top:2px;">${details}</div>
                            <small style="color:var(--text-muted); font-size:0.75rem;">${dateStr}</small>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <span style="color:var(--accent-gold); font-weight:bold;">${amount.toLocaleString()} د.ع</span>
                            <button class="delete-btn" onclick="deleteInvoice('${id}')" title="حذف">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </li>
                `;

                // تعبئة القوائم
                invoicesList.innerHTML += itemHTML;
                recentList.innerHTML += itemHTML;

                // تصنيف الديون (إذا كان يحتوي التفاصيل على كلمة دين أو آجل)
                if (details.includes('دين') || details.includes('آجل')) {
                    debtsList.innerHTML += itemHTML;
                }
            });

            if (debtsList.innerHTML === '') {
                debtsList.innerHTML = '<p style="text-align:center; color:var(--text-muted);">لا توجد ديون مسجلة</p>';
            }

            document.getElementById('total-sum-val').innerText = totalSum.toLocaleString() + ' د.ع';
            document.getElementById('total-count-val').innerText = totalCount;

        }, (error) => {
            console.error("Firestore Error: ", error);
            const syncStatus = document.getElementById('sync-status');
            syncStatus.style.color = 'var(--danger)';
            syncStatus.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i> خطأ بالاتصال';
        });

        // إضافة فاتورة جديدة إلى مجموعة invoices
        window.addInvoice = async function() {
            const customerName = document.getElementById('customerName').value.trim();
            const itemDetails = document.getElementById('itemDetails').value.trim();
            const totalAmount = parseFloat(document.getElementById('totalAmount').value);

            if (!customerName || !itemDetails || isNaN(totalAmount)) {
                alert('يرجى كتابة اسم الزبون وتفاصيل المواد والمبلغ الإجمالي بصورة صحيحة');
                return;
            }

            try {
                await addDoc(collection(db, "invoices"), {
                    customerName: customerName,
                    itemDetails: itemDetails,
                    totalAmount: totalAmount,
                    createdAt: serverTimestamp()
                });

                document.getElementById('customerName').value = '';
                document.getElementById('itemDetails').value = '';
                document.getElementById('totalAmount').value = '';
                
                alert('تم حفظ الفاتورة بنجاح في قاعدة البيانات!');
            } catch (error) {
                alert('حدث خطأ أثناء حفظ الفاتورة: ' + error.message);
            }
        };

        // حذف فاتورة من Firestore
        window.deleteInvoice = async function(id) {
            if (confirm('هل أنت تأكد من حذف هذه الفاتورة نهائياً؟')) {
                try {
                    await deleteDoc(doc(db, "invoices", id));
                } catch (error) {
                    alert('حدث خطأ أثناء الحذف: ' + error.message);
                }
            }
        };

        // التنقل بين الشاشات
        window.switchTab = function(tabId, element) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        };
    </script>
</body>
</html>
