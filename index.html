<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>حلوة عباتچ - نظام المبيعات</title>
    
    <!-- PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f1424">
    
    <style>
        :root {
            --bg-color: #0f1424;
            --card-bg: #1a2035;
            --accent-color: #c5a059;
            --text-color: #ffffff;
            --text-muted: #8a99ad;
            --input-bg: #252d47;
            --danger-color: #e53935;
            --success-color: #4caf50;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(197, 160, 89, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            margin: 0;
            color: var(--accent-color);
            font-size: 1.4rem;
        }

        main {
            flex: 1;
            padding: 15px;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: var(--accent-color);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 5px;
        }

        .stats-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252d47;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .stats-box span {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .invoice-item {
            background: var(--input-bg);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-right: 4px solid var(--accent-color);
        }

        .invoice-info h4 {
            margin: 0 0 4px 0;
            font-size: 0.95rem;
        }

        .invoice-info p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .invoice-amount {
            text-align: left;
        }

        .invoice-amount .price {
            font-weight: bold;
            color: var(--success-color);
            font-size: 1rem;
            display: block;
        }

        .delete-btn {
            background: transparent;
            color: var(--danger-color);
            border: none;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 4px;
            margin-top: 4px;
            width: auto;
        }

        #statusMsg {
            margin-top: 10px;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>حلوة عباتچ - إدارة المبيعات</h1>
    </header>

    <main>
        <!-- نموذج الإضافة -->
        <div class="card">
            <h2>إضافة مبيعات جديدة</h2>
            
            <div class="form-group">
                <label>اسم الزبون</label>
                <input type="text" id="customerName" placeholder="أدخل اسم الزبون">
            </div>

            <div class="form-group">
                <label>تفاصيل الطلب / العباية</label>
                <input type="text" id="itemDetails" placeholder="مثال: عباية بشت - قياس 58">
            </div>

            <div class="form-group">
                <label>المبلغ (د.ع)</label>
                <input type="number" id="totalAmount" placeholder="0">
            </div>

            <button id="saveBtn">حفظ الفاتورة أونلاين</button>
            <div id="statusMsg"></div>
        </div>

        <!-- السجل والمجموع الكلي -->
        <div class="card">
            <h2>سجل المبيعات</h2>
            
            <div class="stats-box">
                <div>إجمالي المبيعات:</div>
                <span id="totalSalesSum">0 د.ع</span>
            </div>

            <div id="invoicesList">
                <p style="text-align:center; color: var(--text-muted);">جاري تحميل المبيعات...</p>
            </div>
        </div>
    </main>

    <!-- Firebase SDK (Modular JS) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
      import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

      // Firebase Config
      const firebaseConfig = {
        apiKey: "AIzaSyDF1WwfdugcjrNWYfs3QXo2ktatdeWuvf4",
        authDomain: "hlwa-abatich.firebaseapp.com",
        projectId: "hlwa-abatich",
        storageBucket: "hlwa-abatich.firebasestorage.app",
        messagingSenderId: "100175694788",
        appId: "1:100175694788:web:3820cf0a38d72c6bcab291",
        measurementId: "G-SCT7EX0CK4"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // 1. دالة حفظ الفاتورة
      async function saveInvoice() {
          const customerName = document.getElementById('customerName').value.trim();
          const itemDetails = document.getElementById('itemDetails').value.trim();
          const totalAmount = document.getElementById('totalAmount').value;
          const statusMsg = document.getElementById('statusMsg');

          if(!customerName || !totalAmount) {
              statusMsg.style.color = '#ff5252';
              statusMsg.innerText = 'يرجى إدخال اسم الزبون والمبلغ!';
              return;
          }

          statusMsg.style.color = '#c5a059';
          statusMsg.innerText = 'جاري الحفظ...';

          try {
              await addDoc(collection(db, "invoices"), {
                  customerName: customerName,
                  itemDetails: itemDetails || 'بدون تفاصيل',
                  totalAmount: Number(totalAmount),
                  createdAt: serverTimestamp()
              });

              statusMsg.style.color = '#4caf50';
              statusMsg.innerText = 'تم حفظ الفاتورة بنجاح!';

              document.getElementById('customerName').value = '';
              document.getElementById('itemDetails').value = '';
              document.getElementById('totalAmount').value = '';

              setTimeout(() => { statusMsg.innerText = ''; }, 3000);
          } catch (e) {
              statusMsg.style.color = '#ff5252';
              statusMsg.innerText = 'حدث خطأ: ' + e.message;
          }
      }

      // 2. دالة عرض واستماع البيانات أونلاين (Real-time)
      function listenToInvoices() {
          const q = query(collection(db, "invoices"), orderBy("createdAt", "desc"));
          
          onSnapshot(q, (snapshot) => {
              const listContainer = document.getElementById('invoicesList');
              const totalSumEl = document.getElementById('totalSalesSum');
              
              if (snapshot.empty) {
                  listContainer.innerHTML = '<p style="text-align:center; color: var(--text-muted);">لا توجد مبيعات مسجلة حتى الآن.</p>';
                  totalSumEl.innerText = '0 د.ع';
                  return;
              }

              let html = '';
              let grandTotal = 0;

              snapshot.forEach((docSnap) => {
                  const data = docSnap.data();
                  const id = docSnap.id;
                  const price = Number(data.totalAmount) || 0;
                  grandTotal += price;

                  html += `
                      <div class="invoice-item">
                          <div class="invoice-info">
                              <h4>${data.customerName}</h4>
                              <p>${data.itemDetails}</p>
                          </div>
                          <div class="invoice-amount">
                              <span class="price">${price.toLocaleString()} د.ع</span>
                              <button class="delete-btn" onclick="window.deleteInvoice('${id}')">حذف</button>
                          </div>
                      </div>
                  `;
              });

              listContainer.innerHTML = html;
              totalSumEl.innerText = grandTotal.toLocaleString() + ' د.ع';
          });
      }

      // 3. دالة الحذف
      window.deleteInvoice = async function(id) {
          if(confirm('هل أنت تأكد من حذف هذه الفاتورة؟')) {
              try {
                  await deleteDoc(doc(db, "invoices", id));
              } catch(e) {
                  alert('حدث خطأ أثناء الحذف');
              }
          }
      };

      document.getElementById('saveBtn').addEventListener('click', saveInvoice);
      listenToInvoices();
    </script>
</body>
</html>
