<style>
  :root {
    --bg-dark: #0f1424;
    --card-bg: rgba(26, 35, 58, 0.7);
    --accent: #d4af37;
    --text-light: #f8fafc;
    --text-muted: #94a3b8;
    --border: rgba(212, 175, 55, 0.2);
    --danger: #ef4444;
    --success: #10b981;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, sans-serif;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-light);
    min-height: 100vh;
    padding-bottom: 70px;
  }

  header {
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 1rem;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    color: var(--accent);
    font-size: 1.25rem;
    font-weight: bold;
  }

  .nav-tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg-dark);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-around;
    padding: 0.5rem;
    z-index: 1000;
  }

  .tab-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    padding: 0.5rem;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 20%;
  }

  .tab-btn.active {
    color: var(--accent);
  }

  .container {
    padding: 1rem;
    max-width: 800px;
    margin: 0 auto;
  }

  .page {
    display: none;
  }

  .page.active {
    display: block;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }

  .form-group {
    margin-bottom: 1rem;
  }

  label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  input, select, textarea {
    width: 100%;
    padding: 0.75rem;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-light);
    font-size: 1rem;
  }

  button.btn-primary {
    width: 100%;
    padding: 0.75rem;
    background: var(--accent);
    color: var(--bg-dark);
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 1rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 1rem;
  }

  .model-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .model-card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
  }

  .model-card .info {
    padding: 0.5rem;
  }

  .badge {
    background: rgba(212, 175, 55, 0.2);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.8rem;
  }

  .table-container {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: right;
  }

  th, td {
    padding: 0.75rem;
    border-bottom: 1px solid var(--border);
  }

  th {
    color: var(--accent);
  }

  /* Modal Styles */
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.8);
    z-index: 2000;
    justify-content: center;
    align-items: center;
    padding: 1rem;
  }

  .modal-content {
    background: var(--bg-dark);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 1.5rem;
  }

  /* Search & Filter Bar */
  .search-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .search-bar input {
    flex: 1;
  }

  /* Sync Indicator */
  .sync-status {
    font-size: 0.8rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<header>
  <div class="logo">حلوة عباتچ</div>
  <div class="sync-status" id="syncStatus">تزامن: محلي</div>
</header>

<main class="container">
  <!-- Models Page -->
  <section id="page-models" class="page active">
    <div class="search-bar">
      <input type="text" id="modelSearch" placeholder="بحث عن موديل..." oninput="renderModels()">
      <button class="btn-primary" style="width: auto; padding: 0 1rem;" onclick="openModal('addModelModal')">+</button>
    </div>
    <div class="grid" id="modelsGrid"></div>
  </section>

  <!-- Sales Page -->
  <section id="page-sales" class="page">
    <div class="card">
      <h2>تسجيل عملية بيع</h2>
      <form id="saleForm" onsubmit="handleSale(event)">
        <div class="form-group">
          <label>الموديل</label>
          <select id="saleModelSelect" required onchange="updateSaleColors()"></select>
        </div>
        <div class="form-group">
          <label>اللون / القياس</label>
          <select id="saleColorSelect" required></select>
        </div>
        <div class="form-group">
          <label>الكمية</label>
          <input type="number" id="saleQty" min="1" value="1" required>
        </div>
        <div class="form-group">
          <label>سعر البيع (للقطعة)</label>
          <input type="number" id="salePrice" required>
        </div>
        <div class="form-group">
          <label>اسم الزبون (اختياري للآجل)</label>
          <input type="text" id="saleCustomer">
        </div>
        <div class="form-group">
          <label>نوع الدفع</label>
          <select id="salePaymentType">
            <option value="cash">نقداً</option>
            <option value="credit">آجل (دين)</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">إتمام البيع</button>
      </form>
    </div>
  </section>

  <!-- Purchases Page -->
  <section id="page-purchases" class="page">
    <div class="card">
      <h2>تسجيل قائمة مشتريات (وجبة)</h2>
      <form id="purchaseForm" onsubmit="handlePurchase(event)">
        <div class="form-group">
          <label>المورد</label>
          <input type="text" id="purSupplier" required>
        </div>
        <div class="form-group">
          <label>الموديل</label>
          <select id="purModelSelect" required></select>
        </div>
        <div class="form-group">
          <label>تفاصيل الألوان والكميات (مثال: أسود:5, أزرق:3)</label>
          <input type="text" id="purVariants" placeholder="اللون:الكمية، اللون:الكمية" required>
        </div>
        <div class="form-group">
          <label>سعر الشراء الكلي/للقطعة</label>
          <input type="number" id="purCost" required>
        </div>
        <button type="submit" class="btn-primary">إضافة للمخزون</button>
      </form>
    </div>
  </section>

  <!-- Debts Page -->
  <section id="page-debts" class="page">
    <h2>سجل الديون</h2>
    <div class="card">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>الزبون</th>
              <th>المبلغ الكلي</th>
              <th>المتبقي</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="debtsTable"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Settings Page -->
  <section id="page-settings" class="page">
    <h2>الإعدادات والبيانات</h2>
    <div class="card">
      <h3>النسخ الاحتياطي والتزامن</h3>
      <p style="color: var(--text-muted); margin-bottom: 1rem; font-size: 0.9rem;">ربط مع Google Sheets للتزامن السحابي</p>
      <div class="form-group">
        <label>رابط Google Apps Script Web App</label>
        <input type="url" id="sheetUrl" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <button class="btn-primary" onclick="saveSettings()">حفظ الإعدادات</button>
      <button class="btn-primary" style="background: var(--success); margin-top: 0.5rem;" onclick="syncData()">تزامن الآن</button>
    </div>
    <div class="card">
      <h3>إدارة البيانات المحتفظ بها</h3>
      <button class="btn-primary" style="background: var(--danger);" onclick="clearAllData()">مسح جميع البيانات المحلية</button>
    </div>
  </section>
</main>

<!-- Add Model Modal -->
<div id="addModelModal" class="modal">
  <div class="modal-content">
    <h2>إضافة موديل جديد</h2>
    <form id="addModelForm" onsubmit="handleAddModel(event)">
      <div class="form-group">
        <label>اسم الموديل/الرمز</label>
        <input type="text" id="mName" required>
      </div>
      <div class="form-group">
        <label>الفئة</label>
        <input type="text" id="mCategory" placeholder="عباية، شال..." required>
      </div>
      <div class="form-group">
        <label>رابط الصورة (إما رابط أو صورة Base64)</label>
        <input type="text" id="mImage">
      </div>
      <div class="form-group">
        <label>سعر البيع الافتراضي</label>
        <input type="number" id="mDefaultPrice" required>
      </div>
      <div style="display: flex; gap: 0.5rem;">
        <button type="submit" class="btn-primary">حفظ</button>
        <button type="button" class="btn-primary" style="background: var(--text-muted);" onclick="closeModal('addModelModal')">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<!-- Navigation Bar -->
<nav class="nav-tabs">
  <button class="tab-btn active" onclick="switchPage('models', this)">
    <span>الموديلات</span>
  </button>
  <button class="tab-btn" onclick="switchPage('sales', this)">
    <span>المبيعات</span>
  </button>
  <button class="tab-btn" onclick="switchPage('purchases', this)">
    <span>المشتريات</span>
  </button>
  <button class="tab-btn" onclick="switchPage('debts', this)">
    <span>الديون</span>
  </button>
  <button class="tab-btn" onclick="switchPage('settings', this)">
    <span>الإعدادات</span>
  </button>
</nav>

<script>
// Initial State & DB Simulation using LocalStorage
const DB_KEYS = {
  MODELS: 'hb_models',
  SALES: 'hb_sales',
  PURCHASES: 'hb_purchases',
  DEBTS: 'hb_debts',
  SETTINGS: 'hb_settings'
};

let state = {
  models: JSON.parse(localStorage.getItem(DB_KEYS.MODELS)) || [],
  sales: JSON.parse(localStorage.getItem(DB_KEYS.SALES)) || [],
  purchases: JSON.parse(localStorage.getItem(DB_KEYS.PURCHASES)) || [],
  debts: JSON.parse(localStorage.getItem(DB_KEYS.DEBTS)) || [],
  settings: JSON.parse(localStorage.getItem(DB_KEYS.SETTINGS)) || { sheetUrl: '' }
};

function saveState() {
  localStorage.setItem(DB_KEYS.MODELS, JSON.stringify(state.models));
  localStorage.setItem(DB_KEYS.SALES, JSON.stringify(state.sales));
  localStorage.setItem(DB_KEYS.PURCHASES, JSON.stringify(state.purchases));
  localStorage.setItem(DB_KEYS.DEBTS, JSON.stringify(state.debts));
  localStorage.setItem(DB_KEYS.SETTINGS, JSON.stringify(state.settings));
}

// Navigation Controls
function switchPage(pageId, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  
  document.getElementById(`page-${pageId}`).classList.add('active');
  btn.classList.add('active');

  if(pageId === 'sales') populateSaleSelects();
  if(pageId === 'purchases') populatePurSelects();
  if(pageId === 'debts') renderDebts();
}

// Modals
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// Models Logic
function handleAddModel(e) {
  e.preventDefault();
  const newModel = {
    id: Date.now().toString(),
    name: document.getElementById('mName').value,
    category: document.getElementById('mCategory').value,
    image: document.getElementById('mImage').value || 'https://via.placeholder.com/150',
    price: parseFloat(document.getElementById('mDefaultPrice').value),
    variants: {} // e.g. { "أسود": 10, "أزرق": 5 }
  };
  
  state.models.push(newModel);
  saveState();
  renderModels();
  closeModal('addModelModal');
  e.target.reset();
}

function renderModels() {
  const grid = document.getElementById('modelsGrid');
  const search = document.getElementById('modelSearch').value.toLowerCase();
  grid.innerHTML = '';

  const filtered = state.models.filter(m => m.name.toLowerCase().includes(search) || m.category.toLowerCase().includes(search));

  filtered.forEach(m => {
    let totalStock = Object.values(m.variants).reduce((a, b) => a + b, 0);
    grid.innerHTML += `
      <div class="model-card">
        <img src="${m.image}" alt="${m.name}" onerror="this.src='https://via.placeholder.com/150'">
        <div class="info">
          <strong>${m.name}</strong>
          <div><span class="badge">${m.category}</span></div>
          <div style="margin-top: 4px; font-size: 0.9rem;">السعر: ${m.price} د.ع</div>
          <div style="font-size: 0.8rem; color: var(--text-muted);">المخزون الكلي: ${totalStock}</div>
        </div>
      </div>
    `;
  });
}

// Purchases Logic
function populatePurSelects() {
  const select = document.getElementById('purModelSelect');
  select.innerHTML = state.models.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
}

function handlePurchase(e) {
  e.preventDefault();
  const modelId = document.getElementById('purModelSelect').value;
  const rawVariants = document.getElementById('purVariants').value; // format: "أسود:5, أحمر:2"
  const model = state.models.find(m => m.id === modelId);

  if(!model) return;

  const pairs = rawVariants.split(',');
  pairs.forEach(p => {
    const [color, qty] = p.split(':');
    if(color && qty) {
      const trimmedColor = color.trim();
      const numQty = parseInt(qty.trim()) || 0;
      model.variants[trimmedColor] = (model.variants[trimmedColor] || 0) + numQty;
    }
  });

  const purchaseRecord = {
    id: Date.now().toString(),
    supplier: document.getElementById('purSupplier').value,
    modelId: modelId,
    cost: parseFloat(document.getElementById('purCost').value),
    date: new Date().toISOString()
  };

  state.purchases.push(purchaseRecord);
  saveState();
  alert('تم إضافة المشتريات وتحديث المخزون بنجاح!');
  e.target.reset();
}

// Sales Logic
function populateSaleSelects() {
  const select = document.getElementById('saleModelSelect');
  select.innerHTML = state.models.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
  updateSaleColors();
}

function updateSaleColors() {
  const modelId = document.getElementById('saleModelSelect').value;
  const model = state.models.find(m => m.id === modelId);
  const colorSelect = document.getElementById('saleColorSelect');

  if(model) {
    document.getElementById('salePrice').value = model.price;
    colorSelect.innerHTML = Object.keys(model.variants).map(c => 
      `<option value="${c}">${c} (متوفر: ${model.variants[c]})</option>`
    ).join('');
  } else {
    colorSelect.innerHTML = '';
  }
}

function handleSale(e) {
  e.preventDefault();
  const modelId = document.getElementById('saleModelSelect').value;
  const color = document.getElementById('saleColorSelect').value;
  const qty = parseInt(document.getElementById('saleQty').value);
  const price = parseFloat(document.getElementById('salePrice').value);
  const customer = document.getElementById('saleCustomer').value || 'زبون عام';
  const payType = document.getElementById('salePaymentType').value;

  const model = state.models.find(m => m.id === modelId);

  if(!model || !model.variants[color] || model.variants[color] < qty) {
    alert('الكمية المطلوبة غير متوفرة في المخزون!');
    return;
  }

  // Deduct Stock
  model.variants[color] -= qty;

  const saleRecord = {
    id: Date.now().toString(),
    modelId,
    color,
    qty,
    price,
    total: qty * price,
    customer,
    payType,
    date: new Date().toISOString()
  };

  state.sales.push(saleRecord);

  // If Credit Sale, add to debts
  if(payType === 'credit') {
    let debt = state.debts.find(d => d.customer === customer);
    if(debt) {
      debt.total += saleRecord.total;
      debt.remaining += saleRecord.total;
    } else {
      state.debts.push({
        id: Date.now().toString(),
        customer,
        total: saleRecord.total,
        remaining: saleRecord.total
      });
    }
  }

  saveState();
  alert('تم تسجيل البيع بنجاح!');
  e.target.reset();
  renderModels();
}

// Debts Logic
function renderDebts() {
  const tbody = document.getElementById('debtsTable');
  tbody.innerHTML = '';

  state.debts.forEach(d => {
    tbody.innerHTML += `
      <tr>
        <td>${d.customer}</td>
        <td>${d.total} د.ع</td>
        <td>${d.remaining} د.ع</td>
        <td>
          <button style="background: var(--success); color: #fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="payDebt('${d.id}')">تسديد</button>
        </td>
      </tr>
    `;
  });
}

function payDebt(id) {
  const debt = state.debts.find(d => d.id === id);
  if(!debt) return;

  const amount = parseFloat(prompt(`المبلغ المتبقي: ${debt.remaining} د.ع\nأدخل مبلغ التسديد:`));
  if(amount && amount > 0) {
    debt.remaining = Math.max(0, debt.remaining - amount);
    saveState();
    renderDebts();
  }
}

// Settings & Sync
function saveSettings() {
  state.settings.sheetUrl = document.getElementById('sheetUrl').value;
  saveState();
  alert('تم حفظ الإعدادات!');
}

async function syncData() {
  if(!state.settings.sheetUrl) {
    alert('يرجى إضافة رابط Google Apps Script أولاً في الإعدادات!');
    return;
  }

  document.getElementById('syncStatus').innerText = 'تزامن: جاري الرابط...';

  try {
    const response = await fetch(state.settings.sheetUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state)
    });

    if(response.ok) {
      document.getElementById('syncStatus').innerText = 'تزامن: تم بنجاح';
      alert('تم التزامن مع Google Sheets بنجاح!');
    } else {
      throw new Error('فشل التزامن');
    }
  } catch(err) {
    document.getElementById('syncStatus').innerText = 'تزامن: فشل';
    alert('حدث خطأ أثناء التزامن: ' + err.message);
  }
}

function clearAllData() {
  if(confirm('هل أنت تأكد من مسح جميع البيانات؟ لا يمكن التراجع عن هذا الإجراء.')) {
    localStorage.clear();
    state = { models: [], sales: [], purchases: [], debts: [], settings: { sheetUrl: '' } };
    renderModels();
    alert('تم مسح البيانات بنجاح.');
  }
}

// Initialization
document.addEventListener('DOMContentLoaded', () => {
  renderModels();
  if(state.settings.sheetUrl) {
    document.getElementById('sheetUrl').value = state.settings.sheetUrl;
  }
});
</script>

</body>
</html>
